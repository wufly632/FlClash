name: Windows manual package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook for tests
        run: yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Restore build hooks
        if: always()
        run: git restore -- pubspec.yaml

  package:
    name: Package Windows x64
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-manual-amd64
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare packaging tools
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (!(Test-Path "$inno\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path "$inno\ISCC.exe")) {
            throw 'Inno Setup compiler not found'
          }
          Add-Content $env:GITHUB_PATH $inno
          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          Add-Content $env:GITHUB_PATH "$pubCache\bin"

      - name: Install dependencies
        run: flutter pub get

      - name: Build installer and portable archive
        run: dart setup.dart windows --env pre --targets exe,zip --verbose

      - name: Verify packages
        run: |
          foreach ($extension in @('exe', 'zip')) {
            $files = @(Get-ChildItem dist -Recurse -File -Filter "*.$extension")
            if ($files.Count -eq 0) { throw "No .$extension package was generated" }
            $files | Select-Object Name, Length
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-windows-x64-${{ github.run_number }}
          path: |
            dist/**/*.exe
            dist/**/*.zip
          if-no-files-found: error
          retention-days: 14
